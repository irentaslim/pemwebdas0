<!DOCTYPE html>
<html>
<head>
    <title>Atribut dari Tag img</title>
</head>
<body>
    <p><b>Tag img hanya dengan atribut src</b></p>
    <img src="image/cookies.jpe">

    <p><b>Tag img dengan border="1"</b></p>
    <img src="image/milk.jpe" border="1">

    <p><b>Tag img dengan height dan width</b></p>
    <img src="image/sekolah.jpe" border="1" height="300" width="200">
</body>
</html>
