<!DOCTYPE html>
<html>
<head>
    <title>Atribut dari Tag Font</title>
</head>
<body>
    <p>
        <font face="Arial">Ini Font Arial</font>
    </p>
    <p>
        <font face="Arial"><i>Ini Font Arial dan miring</i></font>
    </p>
    <p>
        <font face="Verdana" size="4" color="orange">
            <b>Ini Font Verdana berukuran 4, biru, dan tebal</b>
        </font>
    </p>
    <p align="center">
        <font face="Tahoma" color="yellow">
            <b>Ini Font Tahoma kuning, tebal, dan di tengah</b>
        </font>
    </p>
    <p align="center">
        <font face="Arial" color="pink">Ini Font Arial pink, </font>
        <font face="Verdana" color="purple">ini Font Verdana ungu</font>
    </p>
</body>
</html>
